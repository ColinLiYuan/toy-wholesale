<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 400 400">
  <!-- Background -->
  <rect width="400" height="400" fill="#F8F9FA"/>
  
  <!-- Grid pattern -->
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#E9ECEF" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="400" height="400" fill="url(#grid)"/>
  
  <!-- Center circle -->
  <circle cx="200" cy="170" r="80" fill="#E8F0FE" opacity="0.5"/>
  
  <!-- Shopping bag icon -->
  <g transform="translate(160, 130)">
    <!-- Bag body -->
    <path d="M 10 20 L 10 70 Q 10 80 20 80 L 60 80 Q 70 80 70 70 L 70 20 Z" 
          fill="#0056B3" opacity="0.1" stroke="#0056B3" stroke-width="3"/>
    <!-- Bag handle -->
    <path d="M 30 20 Q 30 5 40 5 Q 50 5 50 20" 
          fill="none" stroke="#0056B3" stroke-width="3" stroke-linecap="round"/>
    <!-- Decorative line -->
    <line x1="30" y1="45" x2="50" y2="45" stroke="#0056B3" stroke-width="2" stroke-linecap="round"/>
  </g>
  
  <!-- Text -->
  <text x="200" y="280" font-family="Arial, sans-serif" font-size="16" fill="#6C757D" text-anchor="middle" font-weight="500">
    Product Image
  </text>
  <text x="200" y="305" font-family="Arial, sans-serif" font-size="13" fill="#ADB5BD" text-anchor="middle">
    Coming Soon
  </text>
</svg>
